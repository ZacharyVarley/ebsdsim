name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches ebsdsim._version
        run: |
          VERSION=$(python -c "from ebsdsim._version import __version__; print(__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match ebsdsim._version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Smoke-test wheel
        run: |
          pip install dist/ebsdsim-*.whl
          python -c "import ebsdsim as es; print(es.__version__)"
          python -c "from importlib.resources import files; p=files('ebsdsim').joinpath('data/lightweight_hist_surrogate.npz'); assert p.is_file(), p"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ebsdsim/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
