name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cpu:
    name: CPU tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run CPU tests
        run: pytest -m "not slow and not gpu" -q

      - name: Ruff
        run: ruff check ebsdsim tests scripts

      - name: Import lint
        run: lint-imports

  test-gpu:
    name: GPU tests (macos, Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run GPU tests
        # Per-test timeout: a stuck GPU sync must fail fast, not burn the
        # runner for hours. thread method: signal-based timeouts cannot
        # interrupt a thread blocked inside a native (CFFI) call.
        run: pytest -q --timeout=300 --timeout-method=thread

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Install wheel and smoke test
        run: |
          pip install dist/ebsdsim-*.whl
          python -c "import ebsdsim as es; print(es.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML
        run: python -m sphinx -W -b html docs docs/_build/html
