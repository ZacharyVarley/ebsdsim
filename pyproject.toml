[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsdsim"
dynamic = ["version"]
description = "GPU-accelerated dynamical EBSD master-pattern simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zachary Varley", email = "zacharytvarley@gmail.com" }]
keywords = [
  "EBSD",
  "electron backscatter diffraction",
  "master pattern",
  "dynamical diffraction",
  "Kikuchi",
  "crystallography",
  "Monte Carlo",
  "WebGPU",
  "wgpu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.21",
  # 0.32.0 is a broken upstream release: its wgpu-native v27 callback codegen
  # makes queue.on_submitted_work_done_sync() raise TypeError on all platforms.
    "wgpu>=0.29",
]

[project.urls]
Homepage = "https://github.com/ZacharyVarley/ebsdsim"
Documentation = "https://ebsdsim.readthedocs.io/"
Repository = "https://github.com/ZacharyVarley/ebsdsim"
Issues = "https://github.com/ZacharyVarley/ebsdsim/issues"
Changelog = "https://github.com/ZacharyVarley/ebsdsim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pytest>=7.0",
  "pytest-timeout>=2.2",
  "import-linter>=2.0",
  "ruff>=0.6",
]
docs = [
  "sphinx>=7.0",
  "furo>=2024.0",
  "jupyter>=1.0",
  "matplotlib>=3.5",
]

[tool.setuptools.dynamic]
version = { attr = "ebsdsim._version.__version__" }

[tool.setuptools.packages.find]
include = ["ebsdsim*"]

[tool.setuptools.package-data]
ebsdsim = [
  "gpu/shaders/**/*.wgsl",
  "data/**/*",
  "crystal/reader/*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: long GPU end-to-end tests",
  "gpu: tests that require a WebGPU adapter",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["ebsdsim", "tests", "scripts"]
extend-exclude = [
  "ebsdsim/crystal/_generated",
  "examples",
  "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Style target is 100 cols (verified p99≈97); do not fail CI on existing long lines.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Public re-exports: keep unused-import noise off deliberate package surfaces.
"ebsdsim/__init__.py" = ["F401"]
"ebsdsim/api.py" = ["F401"]
"ebsdsim/*/__init__.py" = ["F401"]
"ebsdsim/*/*/__init__.py" = ["F401"]

[tool.importlinter]
root_package = "ebsdsim"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "ebsdsim.api",
  "ebsdsim.io",
  "ebsdsim.engine",
  "ebsdsim.gpu",
  "ebsdsim.lambert | ebsdsim.energy",
  "ebsdsim.physics",
  "ebsdsim.crystal",
]

